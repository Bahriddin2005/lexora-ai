name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexora
          POSTGRES_PASSWORD: lexora
          POSTGRES_DB: lexora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lexora" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://lexora:lexora@localhost:5432/lexora_test
      - name: Migration is in sync with models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://lexora:lexora@localhost:5432/lexora_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lexora
          POSTGRES_PASSWORD: lexora
          POSTGRES_DB: lexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lexora" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      AI_PROVIDER: fake
      TASKS_MODE: inline
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          uv sync --python 3.12 --frozen
          uv run alembic upgrade head
          uv run python -m scripts.seed
          uv run python -m scripts.create_admin admin@lexora.uz admin12345
          nohup uv run uvicorn app.main:app --port 8000 > backend.log 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/
          PORT=3000 nohup node .next/standalone/server.js > frontend.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000 http://localhost:8000/healthz
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
            frontend/frontend.log
