[project]
name = "lexora-backend"
version = "0.1.0"
description = "Lexora AI backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "redis>=5.0",
    "fakeredis>=2.32",
    "celery[redis]>=5.4",
    "google-genai>=1.0",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "boto3>=1.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
import = ["wordfreq>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "SIM105", "SIM108"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY)"]
addopts = "-m 'not live'"
filterwarnings = ['ignore:Field name "register":UserWarning']
