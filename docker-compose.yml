name: lexora

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://lexora:lexora@db:5432/lexora
    REDIS_URL: redis://redis:6379/0
    TASKS_MODE: celery
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: lexora
    S3_SECRET_KEY: lexora-secret
    CORS_ORIGINS: '["http://localhost:3000"]'
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lexora
      POSTGRES_PASSWORD: lexora
      POSTGRES_DB: lexora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexora"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lexora
      MINIO_ROOT_PASSWORD: lexora-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  backend:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker -l info -Q lexora --concurrency 2

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
